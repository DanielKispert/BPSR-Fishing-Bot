[project]
# Install: pip install -e .    Dev: pip install -e ".[dev]"
name = "fishbuddy"
version = "1.0.0"
description = "Automated fishing bot for Blue Protocol: Star Resonance"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

dependencies = [
    "opencv-python~=4.12.0.88",
    "mss~=10.1.0",
    "PyAutoGUI~=0.9.54",
    "keyboard~=0.13.5",
    "PyQt6~=6.10.0",
    "pyqt6-sip>=13.6",
    "pywinctl>=0.4",
    "pytesseract~=0.3.13",
    "pydantic>=2.0,<3.0",
    "tomli>=1.1.0; python_version < '3.11',",
    "pynput>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# PyInstaller packaging is driven by fishbuddy.spec; see fishbuddy.spec for build config.
# To build the release bundle, run:
#   pyinstaller fishbuddy.spec
# or use the provided build.bat script.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fishbuddy" = [
    "config/default_config.toml",
    "assets/templates/*.png",
]
