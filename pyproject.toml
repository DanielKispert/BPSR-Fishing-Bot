[project]
# Install: pip install -e .    Dev: pip install -e ".[dev]"
name = "bpsr-fishing-bot"
version = "0.1.1"
description = "Automated fishing bot for Blue Protocol: Star Resonance"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"

dependencies = [
    "opencv-python~=4.12.0.88",
    "mss~=10.1.0",
    "PyAutoGUI~=0.9.54",
    "PyQt6~=6.10.0",
    "pyqt6-sip>=13.6",
    "pywinctl>=0.4",
    "pydantic>=2.0,<3.0",
    "tomli>=2.0; python_version < '3.11'",
    "pynput>=1.7,<2.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract~=0.3.13",
]
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# PyInstaller packaging is driven by bpsr-fishing-bot.spec; see bpsr-fishing-bot.spec for build config.
# To build the release bundle, run:
#   pyinstaller bpsr-fishing-bot.spec
# or use the provided build.bat script.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fishbot" = [
    "config/default_config.toml",
    "assets/templates/*.png",
]
