# ─────────────────────────────────────────────
# Screen / Window Settings
# ─────────────────────────────────────────────
[screen]

# The window title used to locate the game on screen.
# The bot looks for a window whose title contains this string.
game_window_title = "Blue Protocol: Star Resonance"

# Reference resolution that all ROI coordinates are based on.
# Do not change unless you have recaptured all templates at a different resolution.
reference_width  = 1920
reference_height = 1080


# ─────────────────────────────────────────────
# Windowed Mode Offsets
# ─────────────────────────────────────────────
# Pixel adjustments to compensate for OS window decorations when the game
# runs in windowed (non-fullscreen) mode.
# Applied only when the game window is not positioned at (0, 0).
[screen.windowed_offsets]

top    = 32
left   = 8
width  = 16
height = 39


# ─────────────────────────────────────────────
# OCR / Tesseract
# ─────────────────────────────────────────────
[ocr]

# Enable OCR-based tension bar reading during the minigame.
# Requires Tesseract to be installed (see tesseract_path below).
enabled = true

# Path to the Tesseract executable.
# "auto" = the bot searches common install locations automatically.
#
# If auto-detection fails, set an explicit path, for example:
#   tesseract_path = "C:\Program Files\Tesseract-OCR\tesseract.exe"
#
# Install Tesseract from: https://github.com/UB-Mannheim/tesseract/wiki
tesseract_path = "auto"
