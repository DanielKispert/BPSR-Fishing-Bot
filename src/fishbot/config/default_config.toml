# FishBuddy defaults -- place config.toml in %LOCALAPPDATA%\FishBuddy\ to override

[hotkeys]
start_stop = "f9"       # start/stop
pause = "f10"           # pause/resume
emergency_stop = "f11"  # immediate stop

[behavior]
anti_detection = true        # random delays + mouse jitter
mouse_jitter = 3             # +-N pixel jitter
delay_variance = 0.2         # +-20% timing variance
casting_delay_variance = 0.15
casting_delay = 0.5          # seconds before casting
quick_finish_enabled = false
debug_mode = false
target_fps = 0               # 0 = unlimited; set 15-30 to save CPU

[behavior.state_timeouts]  # seconds before a stuck state is restarted
starting         = 10
checking_rod     = 15
casting_bait     = 15
waiting_for_bite = 25
playing_minigame = 65
finishing        = 10
buying           = 30

[behavior.auto_buy]
enabled = false      # auto-buy supplies when empty
quantity = 20
bait_type = "cheap"  # "cheap" or "special"

[detection]
precision = 0.65  # template match confidence 0.0-1.0

[detection.precision_overrides]  # per-template overrides (optional)

[detection.templates]
fishing_spot_btn    = "fishing_spot_btn.png"
reg_rod             = "reg_pole.png"
sturdy_rod          = "sturdy_pole.png"
flex_rod            = "flex_pole.png"
broken_rod          = "broken_rod.png"
no_rod              = "no_rod.png"
exclamation         = "exclamation.png"
left_arrow          = "left_arrow.png"
right_arrow         = "right_arrow.png"
failure             = "fish_escaped.png"
success             = "success.png"
continue            = "continue.png"
level_check         = "level_check.png"
connect_server      = "connect.png"
shop_icon           = "shop_icon.png"
shop_rod_tab        = "shop_rod_tab.png"
shop_bait_tab       = "shop_bait_tab.png"
shop_bait_cheap_tab = "shop_bait_cheap_tab.png"
shop_quantity       = "shop_quantity.png"
shop_buy_btn        = "shop_buy_btn.png"
shop_ok_btn         = "shop_ok_btn.png"
shop_confirm        = "shop_confirm.png"
shop_close          = "shop_close.png"
empty_bait_slot     = "empty_bait_slot.png"

[detection.color_match_templates]  # HSV ranges [h_lo, s_lo, v_lo, h_hi, s_hi, v_hi]
left_arrow  = [0, 30, 80, 30, 255, 255]
right_arrow = [0, 30, 80, 30, 255, 255]

